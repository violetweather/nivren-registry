name: Verify the registry

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Pin the registry root key independently of the checkout
        run: |
          # A pull request that swaps v1/trust/root.pub and re-signs everything
          # must not be able to verify itself: the expected key lives here.
          expected="8c26f6f713c20f165ca76d6e42424ca1498a78277647674b35d8d33dfa93bec7"
          actual="$(tr -d '[:space:]' < v1/trust/root.pub)"
          [ "$actual" = "$expected" ] || { echo "root.pub does not match the pinned registry root key" >&2; exit 1; }
      - name: Fetch the Nivren CLI
        run: |
          # The verifier must be at least 1.0.1: it understands the v2 trust
          # documents (advisories_sha256, package-bound authorizations). The
          # archive is checked against the release checksum manifest.
          base="https://github.com/violetweather/nivren/releases/download/v1.0.1"
          curl -sSfL -o nivren.zip "$base/nivren-v1.0.1-linux-x64.zip"
          curl -sSfL -o SHA256SUMS "$base/SHA256SUMS"
          expected="$(awk '$2 == "nivren-v1.0.1-linux-x64.zip" { print $1 }' SHA256SUMS)"
          [ -n "$expected" ] || { echo "release checksum manifest lacks the CLI archive" >&2; exit 1; }
          echo "$expected  nivren.zip" | sha256sum -c -
          unzip -o nivren.zip -d nivren-cli
          NIV=$(find nivren-cli -name niv -type f | head -1)
          chmod +x "$NIV"
          echo "NIV=$NIV" >> "$GITHUB_ENV"
      - name: Verify every signed release
        run: python3 tools/verify_registry.py --niv "$NIV"
      - name: Wait for the live registry to serve this generation
        if: github.event_name == 'push'
        run: |
          # Pages deploys and the CDN lag the push by a little; installing
          # against the previous generation would fail for the wrong reason.
          expected="$(python3 -c 'import json; print(json.load(open("v1/trust/status.json"))["generation"])')"
          for attempt in $(seq 1 40); do
            live="$(curl -sSfL "https://violetweather.github.io/nivren-registry/v1/trust/status.json?t=$attempt" | python3 -c 'import json,sys; print(json.load(sys.stdin)["generation"])' || echo 0)"
            [ "$live" = "$expected" ] && { echo "live registry serves generation $live"; exit 0; }
            sleep 15
          done
          echo "live registry still serves generation $live, expected $expected" >&2
          exit 1
      - name: Install from the live registry
        if: github.event_name == 'push'
        run: |
          mkdir -p live-install
          printf '[package]\nname = "registry_ci"\nversion = "1.0.0"\nentry = "main.niv"\n\n[dependencies]\nnivren_stats = "1.0.0"\n' > live-install/niv.toml
          printf 'use "@nivren_stats"\n\nshow(nivren_stats.mean with { values set [2.0, 4.0, 6.0] })\n' > live-install/main.niv
          "$NIV" install --trusted https://violetweather.github.io/nivren-registry v1/trust/root.pub live-install
          "$NIV" run live-install
